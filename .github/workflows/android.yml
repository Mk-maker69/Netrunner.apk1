name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar arquivos do repositorio
        run: |
          ls -la
          ls -la app || echo "SEM PASTA app"
      - name: Corrigir arquivos do Gradle da raiz
        run: |
          printf '%s\n' "plugins { id 'com.android.application' version '8.5.2' apply false }" > build.gradle
          printf '%s\n' "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" "rootProject.name = 'Netrunner'" "include ':app'" > settings.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Netrunner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
